<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nishanth Sales Computation</title>
</head>

<body>

    <h1>Nishanth Nathan sales computation</h1>

    <form>

        <label for="numberItems">Enter number items</label>
        <input type="number"
               id="numberItems"
               value="1">
        <br><br>

        <label for="itemCost">Enter the cost of one item</label>
        <input type="number"
               id="itemCost"
               value="20.0">
        <br><br>

        <label for="numberForDiscount">
            Enter number to get discount
        </label>

        <input type="number"
               id="numberForDiscount"
               value="10">
        <br><br>

        <label for="discountRate">
            Enter the discount rate
        </label>

        <input type="number"
               id="discountRate"
               value="0.15"
               step="0.01">
        <br><br>

        <input type="button"
               value="Show costs"
               onclick="doDiscount()">

    </form>

    <p id="costResult">
        Costs will appear here
    </p>


    <hr>


    <h2>Choose an Operation</h2>

    <form>

        <input type="radio"
               id="product"
               name="operation"
               value="mul"
               onclick="chooseOp()">

        <label for="product">Product</label>

        <br>

        <input type="radio"
               id="sum"
               name="operation"
               value="add"
               onclick="chooseOp()">

        <label for="sum">Sum</label>

        <br>

        <input type="radio"
               id="divide"
               name="operation"
               value="div"
               onclick="chooseOp()">

        <label for="divide">Divide</label>

    </form>

    <p id="operationResult">
        Operation result will appear here
    </p>


    <script>

        function doDiscount() {

            let number = Number(
                document.getElementById("numberItems").value
            );

            let cost = Number(
                document.getElementById("itemCost").value
            );

            let discountRate = Number(
                document.getElementById("discountRate").value
            );

            let discountAt = Number(
                document.getElementById("numberForDiscount").value
            );

            let costs = "";

            for (let i = 1; i <= 5; i++) {

                let checkCount = number * i;
                let totalCost;

                if (checkCount <= discountAt) {

                    totalCost = checkCount * cost;

                } else {

                    totalCost =
                        (discountAt * cost) +
                        ((checkCount - discountAt) *
                        cost *
                        (1 - discountRate));
                }

                costs +=
                    "checkCount " +
                    checkCount +
                    " is " +
                    totalCost +
                    "; ";
            }

            document.getElementById("costResult").innerHTML =
                "Costs are: " + costs;
        }


        function chooseOp() {

            let count = Number(
                document.getElementById("numberItems").value
            );

            let discountAt = Number(
                document.getElementById("numberForDiscount").value
            );

            let result;
            let message;

            if (document.getElementById("product").checked) {

                result = count * discountAt;

                message =
                    count +
                    " times " +
                    discountAt +
                    " is " +
                    result;

            } else if (document.getElementById("sum").checked) {

                result = count + discountAt;

                message =
                    count +
                    " plus " +
                    discountAt +
                    " is " +
                    result;

            } else if (document.getElementById("divide").checked) {

                result = count / discountAt;

                message =
                    count +
                    " divided by " +
                    discountAt +
                    " is " +
                    result;
            }

            document.getElementById("operationResult").innerHTML =
                message;
        }

    </script>

</body>

</html>
