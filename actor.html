<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nishanth's Actor Guess</title>
</head>

<body>

    <h1>Actors by Nishanth Nathan</h1>

    <form>

        <label for="actor">Peter Pan</label>
        <input type="password"
               id="actor"
               name="actor"
               value="Robin Williams">
        <br><br>

        <label for="actorGuess">Who is the actor</label>
        <input type="text"
               id="actorGuess"
               name="actorGuess">
        <br><br>

        <input type="button"
               value="Check the guess"
               onclick="checkActor()">

    </form>

    <p id="result">Correct guesses: 0 Wrong guesses: 0</p>

    <hr>

    <h2>My Favorite Foods</h2>

    <div>
        <img id="foodImage"
             src="food1.jpg"
             width="150"
             height="150"
             onclick="updatePic()">
    </div>


    <script>

        let correct = 0;
        let notCorrect = 0;
        let usePic = 1;

        function checkActor() {

            let actor = document.getElementById("actor").value;
            let guess = document.getElementById("actorGuess").value;

            if (actor === guess) {
                correct = correct + 1;
                alert("That's right");
            } else {
                notCorrect = notCorrect + 1;
                alert("Better luck next time");
            }

            document.getElementById("result").innerHTML =
                "Correct guesses: " + correct +
                " Wrong guesses: " + notCorrect;
        }


        function updatePic() {

            let image = document.getElementById("foodImage");

            switch (usePic) {

                case 1:
                    image.src = "food2.jpg";
                    usePic = 2;
                    break;

                case 2:
                    image.src = "food3.jpg";
                    usePic = 3;
                    break;

                case 3:
                    image.src = "food1.jpg";
                    usePic = 1;
                    break;
            }
        }

    </script>

</body>

</html>
